[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
# via_ir stays off (CLAUDE.md): split functions instead.
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
